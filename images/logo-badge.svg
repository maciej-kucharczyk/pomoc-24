<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 140" width="240" height="140">
  <defs>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12423A" />
      <stop offset="100%" stop-color="#0B2E24" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Owalne tło z podwójną ramką -->
  <ellipse cx="120" cy="70" rx="112" ry="62" fill="url(#badgeGrad)" stroke="#FFFFFF" stroke-width="4" filter="url(#shadow)"/>
  <ellipse cx="120" cy="70" rx="104" ry="54" fill="none" stroke="#FF7A1A" stroke-width="2" opacity="0.9"/>

  <!-- Górny napis POMOC 24H -->
  <text x="120" y="38" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="900" fill="#FFFFFF" letter-spacing="1.5">
    POMOC<tspan fill="#FF7A1A">24</tspan>
  </text>

  <!-- Stylizowana autolaweta na środku -->
  <g transform="translate(85, 46)">
    <polygon points="5,24 65,22 65,28 5,30" fill="#FF7A1A"/>
    <path d="M40 22 L40 6 L55 6 L65 18 L65 22 Z" fill="#7FD9B0"/>
    <polygon points="43,8 53,8 60,18 43,18" fill="#0B2E24"/>
    <circle cx="20" cy="30" r="6" fill="#000" stroke="#FFF" stroke-width="2"/>
    <circle cx="55" cy="30" r="6" fill="#000" stroke="#FFF" stroke-width="2"/>
  </g>

  <!-- Dolny łuk / napis POMOC DROGOWA 24/7 -->
  <text x="120" y="104" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#FF7A1A" letter-spacing="1.8">
    WROCŁAW • LAWETA
  </text>
</svg>